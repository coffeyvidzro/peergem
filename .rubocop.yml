# .rubocop.yml
# PeerGem house style. Extends Rails Omakase and adds fintech-specific rules.

inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/migrate/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "node_modules/**/*"

Lint/FloatComparison:
  Enabled: true
  Severity: error
