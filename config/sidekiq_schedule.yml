identity_cleanup:
  cron: "17 3 * * *"
  class: IdentityCleanupJob
  queue: low
  description: Remove expired identity records beyond their retention windows

geoip_refresh:
  cron: "0 4 * * 2" # every Tuesday at 04:00 UTC
  class: "GeoipRefreshJob"
  queue: default
  description: "Refresh MaxMind GeoLite2-City database"
