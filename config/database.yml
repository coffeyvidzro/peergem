default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: postgres
  username: peergem
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: peergem_development

test:
  <<: *default
  database: peergem_test

production:
  <<: *default
  database: peergem_production
