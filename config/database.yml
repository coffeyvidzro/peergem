default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "postgres") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "peergem") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: peergem_development

test:
  <<: *default
  database: peergem_test

production:
  <<: *default
  database: peergem_production
